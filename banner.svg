<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.55" stop-color="#f2fbf6"/>
      <stop offset="1" stop-color="#fff7ec"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3a5d"/>
      <stop offset="1" stop-color="#0e7a5f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- decorative dots -->
  <g fill="#0b3a5d" opacity="0.08">
    <circle cx="1080" cy="60" r="5"/><circle cx="1130" cy="110" r="5"/><circle cx="1050" cy="120" r="5"/>
    <circle cx="1105" cy="180" r="5"/><circle cx="1000" cy="60" r="5"/><circle cx="1140" cy="40" r="4"/>
    <circle cx="60" cy="310" r="5"/><circle cx="110" cy="330" r="5"/><circle cx="30" cy="330" r="5"/>
    <circle cx="80" cy="285" r="4"/><circle cx="120" cy="300" r="4"/>
  </g>
  <circle cx="1045" cy="215" r="150" fill="#0e7a5f" opacity="0.05"/>
  <circle cx="180" cy="60" r="110" fill="#2f7de1" opacity="005"/>

  <!-- eyebrow -->
  <g>
    <rect x="72" y="66" width="14" height="14" rx="4" fill="#0e7a5f"/>
    <text x="98" y="79" font-size="21" fill="#0e7a5f" font-weight="600" letter-spacing="2">2026 中文互联网流行理论档案</text>
  </g>

  <!-- title -->
  <text x="70" y="190" font-size="96" font-weight="800" fill="url(#titleGrad)">互联网理论</text>
  <text x="74" y="246" font-size="40" font-weight="600" fill="#41607a" letter-spacing="1">Internet Theories</text>

  <!-- subtitle chip -->
  <g>
    <rect x="72" y="278" width="368" height="46" rx="23" fill="#ffffff" opacity="0.85" stroke="#cfe3d9"/>
    <circle cx="102" cy="301" r="11" fill="#0e7a5f"/>
    <text x="104" y="308" font-size="15" font-weight="700" fill="#ffffff">17</text>
    <text x="124" y="308" font-size="20" fill="#0b3a5d" font-weight="600">个「××理论」 · 中英双语</text>
  </g>

  <!-- icons row -->
  <g>
    <!-- water drop -->
    <g transform="translate(690,120)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#bcd9f5"/>
      <path d="M40 16 C40 16 60 42 60 54 a20 20 0 0 1 -40 0 C20 42 40 16 40 16 Z" fill="#2f7de1"/>
    </g>
    <!-- dumbbell -->
    <g transform="translate(790,120)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#f0d9b5"/>
      <rect x="18" y="34" width="44" height="10" rx="5" fill="#e8a33d"/>
      <rect x="10" y="26" width="8" height="26" rx="4" fill="#e8a33d"/>
      <rect x="62" y="26" width="8" height="26" rx="4" fill="#e8a33d"/>
    </g>
    <!-- moon -->
    <g transform="translate(890,120)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#d5cdf0"/>
      <path d="M46 16 a26 26 0 1 0 12 44 a21 21 0 0 1 -12 -44 Z" fill="#6c5ce7"/>
      <circle cx="58" cy="24" r="3" fill="#6c5ce7"/>
    </g>
    <!-- gold bar -->
    <g transform="translate(990,120)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#eed9a4"/>
      <path d="M18 44 L26 28 L54 28 L62 44 L56 54 L24 54 Z" fill="#e8b93b"/>
      <path d="M18 44 L62 44 L56 54 L24 54 Z" fill="#c99a22"/>
    </g>
    <!-- coin -->
    <g transform="translate(1090,120)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#eed9a4"/>
      <circle cx="40" cy="40" r="20" fill="#f2c14e"/>
      <text x="40" y="49" font-size="24" font-weight="800" fill="#8a6410" text-anchor="middle">₿</text>
    </g>
    <!-- coffee cup -->
    <g transform="translate(740,220)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#d9c3b0"/>
      <path d="M22 32 h30 v18 a12 12 0 0 1 -12 12 h-6 a12 12 0 0 1 -12 -12 Z" fill="#7a4a2b"/>
      <path d="M52 34 h6 a8 8 0 0 1 0 16 h-6" fill="none" stroke="#7a4a2b" stroke-width="4"/>
      <path d="M28 22 v-6 M36 22 v-8 M44 22 v-6" stroke="#b08968" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- leaf -->
    <g transform="translate(840,220)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#bfe3c8"/>
      <path d="M56 22 C36 22 24 34 24 50 c0 4 1 7 2 9 C28 44 36 38 46 36 C36 44 30 52 28 60 c6 2 12 2 18 -2 C58 50 58 30 56 22 Z" fill="#2f9e5f"/>
    </g>
    <!-- laptop / code -->
    <g transform="translate(940,220)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#c9d6e8"/>
      <rect x="24" y="26" width="32" height="22" rx="3" fill="#33507a"/>
      <rect x="18" y="52" width="44" height="6" rx="3" fill="#33507a"/>
      <text x="40" y="43" font-size="14" font-weight="700" fill="#8fd0ff" text-anchor="middle" font-family="Menlo, Consolas, monospace">&lt;/&gt;</text>
    </g>
    <!-- book -->
    <g transform="translate(1040,220)">
      <circle cx="40" cy="40" r="40" fill="#ffffff" opacity="0.95" stroke="#e3c9dd"/>
      <path d="M22 28 h16 a6 6 0 0 1 4 4 v22 a6 6 0 0 0 -4 -4 h-16 Z" fill="#b04a8f"/>
      <path d="M58 28 h-16 a6 6 0 0 0 -4 4 v22 a6 6 0 0 1 4 -4 h16 Z" fill="#8f3a70"/>
    </g>
  </g>

  <!-- corner ribbon -->
  <g transform="translate(1010,296)">
    <rect x="0" y="0" width="118" height="34" rx="17" fill="#0b3a5d"/>
    <text x="59" y="23" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ZH / EN</text>
  </g>
</svg>
